// TODO: consider circular reference support

syntax = "proto3";

package aqua;

import "google/protobuf/struct.proto";

option csharp_namespace = "Aqua.Protobuf.Schema";

// Self-describing, type-safe representation of an Aqua leaf-value union.
message Value {
  oneof kind {
    google.protobuf.NullValue null = 1;
    string string = 2;
    Scalar scalar = 3;
    PackedArray packed_array = 4;
    Collection collection = 5;
    // Tensor tensor = 6;

    // dynamic
    DynamicObject dynamic_object = 80;

    // type system
    TypeInfo type_info = 90;
    FieldInfo field_info = 91;
    PropertyInfo property_info = 92;
    ConstructorInfo constructor_info = 93;
    MethodInfo method_info = 94;
  }
}

// A registry-backed scalar leaf. 'data' is the deterministic little-endian
// encoding for 'type_key' as produced by the scalar codec.
message Scalar {
  DataType type = 1;
  bytes data = 2;
  
  enum DataType {
    undefined = 0;
    uint8 = 1;
    int8 = 2;
    int16 = 3;
    uint16 = 4;
    int32 = 5;
    uint32 = 6;
    int64 = 7;
    uint64 = 8;
    int128 = 9;
    uint128 = 10;
    float16 = 11;
    float32 = 12;
    float64 = 13;
    bool = 14;
    char = 15;
    decimal = 16;
    big_integer = 17;
//  complex64 = 18;
    complex128 = 19;
    uuid = 20;
    date_time = 21;
    date_time_offset = 22;
    time_span = 23;
    date_only = 24;
    time_only = 25;
  }
}

// A packed 1-D array of a fixed-width blittable primitive. 'data' is the
// little-endian byte payload; 'element_type' resolves the element type.
message PackedArray {
  ElementType element_type = 1;
  bytes data = 2;
  
  // PackedArray.ElementType is a subset of Scalar.DataType
  enum ElementType {
    undefined = 0;
    uint8 = 1;
    int8 = 2;
    int16 = 3;
    uint16 = 4;
    int32 = 5;
    uint32 = 6;
    int64 = 7;
    uint64 = 8;
    int128 = 9;
    uint128 = 10;
    float16 = 11;
    float32 = 12;
    float64 = 13;
    bool = 14;
    char = 15;
  }
}

// A heterogeneous or null-bearing collection of leaf values.
message Collection {
  repeated Value items = 1;
}

message DynamicObject {
  oneof node {
    google.protobuf.NullValue null = 1;
    DynamicObjectValue value = 2;
    Ref ref = 3;
  }
}

// 'has_properties' distinguishes a null property set (IsNull) from an empty one.
message DynamicObjectValue {
  uint32 id = 1;
  TypeInfo type = 2;
  bool has_properties = 3;
  map<string, Value> properties = 4;
}

message TypeInfo {
  oneof node {
    google.protobuf.NullValue null = 1;
    TypeInfoValue value = 2;
    Ref ref = 3;
  }
}

message TypeInfoValue {
  uint32 id = 1;
  optional string name = 2;
  optional string namespace = 3;
  TypeInfo declaring_type = 4;
  repeated TypeInfo generic_arguments = 5;
  bool is_anonymous_type = 6;
  bool is_generic_type = 7;
  repeated PropertyInfo properties = 8;
}

message MemberInfo {
  oneof kind {
    google.protobuf.NullValue null = 1;
    FieldInfo field = 2;
    PropertyInfo property = 3;
    ConstructorInfo constructor = 4;
    MethodInfo method = 5;
    Ref ref = 6;
  }
}

message PropertyInfo {
  oneof node {
    google.protobuf.NullValue null = 1;
    PropertyInfoValue value = 2;
    Ref ref = 3;
  }
}

message PropertyInfoValue {
  uint32 id = 1;
  // MemberInfo
  string name = 2;
  TypeInfo declaring_type = 3;
  optional bool is_static = 4;
  // PropertyInfo
  TypeInfo property_type = 5;
}

message FieldInfo {
  oneof node {
    google.protobuf.NullValue null = 1;
    FieldInfoValue value = 2;
    Ref ref = 3;
  }
}

message FieldInfoValue {
  uint32 id = 1;
  // MemberInfo
  string name = 2;
  TypeInfo declaring_type = 3;
  optional bool is_static = 4;
  // FieldInfo
}

message ConstructorInfo {
  oneof node {
    google.protobuf.NullValue null = 1;
    ConstructorInfoValue value = 2;
    Ref ref = 3;
  }
}

message ConstructorInfoValue {
  uint32 id = 1;
  // MemberInfo
  string name = 2;
  TypeInfo declaring_type = 3;
  optional bool is_static = 4;
  // MethodBaseInfo
  repeated TypeInfo generic_argument_types = 5;
  repeated TypeInfo parameter_types = 6;
}

message MethodInfo {
  oneof node {
    google.protobuf.NullValue null = 1;
    MethodInfoValue value = 2;
    Ref ref = 3;
  }
}

message MethodInfoValue {
  uint32 id = 1;
  // MemberInfo
  string name = 2;
  TypeInfo declaring_type = 3;
  optional bool is_static = 4;
  // MethodBaseInfo
  repeated TypeInfo generic_argument_types = 5;
  repeated TypeInfo parameter_types = 6;
  // MethodInfo
  TypeInfo return_type = 7;
}

message Ref {
  uint32 id = 1;
}
