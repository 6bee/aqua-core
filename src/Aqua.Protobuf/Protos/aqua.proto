// TODO: consider circular reference support

syntax = "proto3";

package aqua;

option csharp_namespace = "Aqua.Protobuf.Schema";

// Self-describing, type-safe representation of an Aqua leaf-value union.
message Value {
  oneof kind {
    NullValue null = 1;
    string string = 2;
    Scalar scalar = 3;
    PackedArray packed_array = 4;
    Collection collection = 5;
    // Tensor tensor = 6

    // dynamic
    DynamicObject dynamic_object = 80;

    // type system
    TypeInfo type_info = 81;
    MemberInfo member_info = 82;
    PropertyInfo property_info = 83;
    FieldInfo field_info = 84;
    ConstructorInfo constructor_info = 85;
    MethodInfo method_info = 86;
  }
}

// Explicit null marker so a null leaf round-trips distinctly from an unset value.
message NullValue {
}

// A registry-backed scalar leaf. 'data' is the deterministic little-endian
// encoding for 'type_key' as produced by the scalar codec.
message Scalar {
  DataType type = 1;
  bytes data = 2;
}

// A packed 1-D array of a fixed-width blittable primitive. 'data' is the
// little-endian byte payload; 'element_type' resolves the element type.
message PackedArray {
  DataType element_type = 1;
  bytes data = 2;
}

// A heterogeneous or null-bearing collection of leaf values.
message Collection {
  repeated Value items = 1;
}

// 'has_properties' distinguishes a null property set (IsNull) from an empty one.
message DynamicObject {
  TypeInfo type = 1;
  bool has_properties = 2;
  map<string, Value> properties = 3;
}

message TypeInfo {
  optional string name = 1;
  optional string namespace = 2;
  TypeInfo declaring_type = 3;
  repeated TypeInfo generic_arguments = 4;
  bool is_anonymous_type = 5;
  bool is_generic_type = 6;
  repeated PropertyInfo properties = 7;
}

message MemberInfo {
  oneof kind {
    PropertyInfo property = 1;
    FieldInfo field = 2;
    ConstructorInfo constructor = 3;
    MethodInfo method = 4;
  }
}

message PropertyInfo {
  // MemberInfo
  string name = 1;
  TypeInfo declaring_type = 2;
  optional bool is_static = 3;
  // PropertyInfo
  TypeInfo property_type = 4;
}

message FieldInfo {
  // MemberInfo
  string name = 1;
  TypeInfo declaring_type = 2;
  optional bool is_static = 3;
  // FieldInfo
}

message ConstructorInfo {
  // MemberInfo
  string name = 1;
  TypeInfo declaring_type = 2;
  optional bool is_static = 3;
  // MethodBaseInfo
  repeated TypeInfo generic_argument_types = 4;
  repeated TypeInfo parameter_types = 5;
}

message MethodInfo {
  // MemberInfo
  string name = 1;
  TypeInfo declaring_type = 2;
  optional bool is_static = 3;
  // MethodBaseInfo
  repeated TypeInfo generic_argument_types = 4;
  repeated TypeInfo parameter_types = 5;
  // MethodInfo
  TypeInfo return_type = 6;
}

enum DataType {
    undefined = 0;
    uint8 = 1;
    int8 = 2;
    int16 = 3;
    uint16 = 4;
    int32 = 5;
    uint32 = 6;
    int64 = 7;
    uint64 = 8;
    int128 = 9;
    uint128 = 10;
    float16 = 11;
    float32 = 12;
    float64 = 13;
    big_integer = 14;
//  complex64 = 15;
    complex128 = 16;
    bool = 17;
    char = 18;
    decimal = 19;
    uuid = 20;
    date_time = 21;
    date_time_offset = 22;
    time_span = 23;
    date_only = 24;
    time_only = 25;
}
